<!-- Skills Section -->
<div id="skills" class="bg-gray-100 py-16 scroll-mt-20">
	<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
		<h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-12 text-center fade-in">Skills & Technologies</h2>
		
		<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
			<!-- Languages -->
			<div class="bg-white rounded-lg shadow-lg p-6 fade-in delay-100">
				<div class="flex items-center mb-4">
					<div class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg p-3">
						<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
						</svg>
					</div>
					<h3 class="text-xl font-bold text-gray-800 ml-4">Languages</h3>
				</div>
				<div class="flex flex-wrap gap-2">
					<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">Swift</span>
					<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">Objective-C</span>
					<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">Python</span>
				</div>
			</div>
			
			<!-- Frameworks -->
			<div class="bg-white rounded-lg shadow-lg p-6 fade-in delay-200">
				<div class="flex items-center mb-4">
					<div class="bg-gradient-to-r from-green-500 to-teal-600 rounded-lg p-3">
						<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path>
						</svg>
					</div>
					<h3 class="text-xl font-bold text-gray-800 ml-4">Frameworks</h3>
				</div>
				<div class="flex flex-wrap gap-2">
					<span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-semibold">SwiftUI</span>
					<span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-semibold">UIKit</span>
					<span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-semibold">Combine</span>
					<span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-semibold">Core Data</span>
				</div>
			</div>
			
			<!-- Tools -->
			{% include technologies.html %}
			
			<!-- Architecture -->
			<div class="bg-white rounded-lg shadow-lg p-6 fade-in delay-400">
				<div class="flex items-center mb-4">
					<div class="bg-gradient-to-r from-purple-500 to-pink-600 rounded-lg p-3">
						<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
						</svg>
					</div>
					<h3 class="text-xl font-bold text-gray-800 ml-4">Architecture</h3>
				</div>
				<div class="flex flex-wrap gap-2">
					<span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-semibold">MVVM</span>
					<span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-semibold">MVC</span>
					<span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-semibold">VIPER</span>
					<span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-semibold">Clean Architecture</span>
				</div>
			</div>
			
			<!-- Testing -->
			<div class="bg-white rounded-lg shadow-lg p-6 fade-in delay-100">
				<div class="flex items-center mb-4">
					<div class="bg-gradient-to-r from-indigo-500 to-blue-600 rounded-lg p-3">
						<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
						</svg>
					</div>
					<h3 class="text-xl font-bold text-gray-800 ml-4">Testing</h3>
				</div>
				<div class="flex flex-wrap gap-2">
					<span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-semibold">XCTest</span>
					<span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-semibold">XCUITest</span>
					<span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-semibold">Unit Testing</span>
				</div>
			</div>
			
			<!-- Other -->
			<div class="bg-white rounded-lg shadow-lg p-6 fade-in delay-200">
				<div class="flex items-center mb-4">
					<div class="bg-gradient-to-r from-yellow-500 to-orange-600 rounded-lg p-3">
						<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
						</svg>
					</div>
					<h3 class="text-xl font-bold text-gray-800 ml-4">Other</h3>
				</div>
				<div class="flex flex-wrap gap-2">
					<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-semibold">REST APIs</span>
					<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-semibold">Firebase</span>
					<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-semibold">CI/CD</span>
					<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-semibold">Agile</span>
				</div>
			</div>
		</div>
	</div>
</div>
