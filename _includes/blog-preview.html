<!-- Blog Preview Section -->
<div id="writing" class="py-16 scroll-mt-20">
	<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
		<div class="flex items-center justify-between mb-12">
			<h2 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-gray-100 fade-in">Latest Writing</h2>
			<a href="/blog" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-semibold transition duration-200 fade-in">All posts →</a>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
			{% for post in site.posts limit:3 %}
			<article class="bg-white dark:bg-gray-900 rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow duration-300 fade-in flex flex-col">
				{% if post.cover_image %}
				<div class="h-40 overflow-hidden">
					<img src="{{ post.cover_image }}" alt="{{ post.cover_image_alt | default: post.title }}" class="w-full h-full object-cover">
				</div>
				{% else %}
				<div class="h-40 bg-gradient-to-r from-blue-500 to-purple-600"></div>
				{% endif %}
				<div class="p-6 flex flex-col flex-1">
					<div class="text-sm text-gray-400 dark:text-gray-500 mb-2">{{ post.date | date: "%B %-d, %Y" }}</div>
					<h3 class="text-base font-bold text-gray-800 dark:text-gray-100 mb-2 leading-snug">{{ post.title }}</h3>
					{% if post.description %}
					<p class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed mb-4 flex-1">{{ post.description | truncate: 100 }}</p>
					{% endif %}
					<a href="{{ post.url }}" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-semibold text-sm inline-flex items-center mt-auto">
						Read more
						<svg class="w-4 h-4 ml-1" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
						</svg>
					</a>
				</div>
			</article>
			{% endfor %}
		</div>
	</div>
</div>
