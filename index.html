<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="UTF-8">
		<!-- Dark mode: apply theme before paint to prevent FOUC -->
		<script>
			(function() {
				var t = localStorage.getItem('theme');
				if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- Preload hero image to reduce LCP -->
		<link rel="preload" as="image" href="/images/fotis-fotopoulos-6sAl6aQ4OWI-unsplash.jpg">
		<title>Rajmani Kushwaha - Senior Software Engineer | iOS & Swift Developer</title>
		<meta name="description" content="Senior Software Engineer at Target leading List & Registry iOS team. 10+ years building apps for 200M+ users. Former Lead Engineer at Tokopedia.">
		<meta name="keywords" content="Software Engineer, iOS Developer, Swift, Mobile Engineer, Rajmani Kushwaha, Target, Tokopedia, SwiftUI, TCA">
		<meta name="author" content="Rajmani Kushwaha">

		<!-- Canonical Link -->
		<link rel="canonical" href="https://rajmanikush.com">

		<!-- Open Graph / Social Media -->
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://rajmanikush.com">
		<meta property="og:title" content="Rajmani Kushwaha - Senior Software Engineer">
		<meta property="og:description" content="Senior Software Engineer at Target leading List & Registry iOS team. 10+ years building apps for 200M+ users. Former Lead Engineer at Tokopedia.">
		<meta property="og:image" content="https://rajmanikush.com/images/Rajmani-Kushwaha.jpeg">

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:url" content="https://rajmanikush.com">
		<meta name="twitter:title" content="Rajmani Kushwaha - Senior Software Engineer">
		<meta name="twitter:description" content="Senior Software Engineer at Target leading List & Registry iOS team. 10+ years building apps for 200M+ users. Former Lead Engineer at Tokopedia.">
		<meta name="twitter:image" content="https://rajmanikush.com/images/Rajmani-Kushwaha.jpeg">

		<!-- JSON-LD Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Person",
			"name": "Rajmani Kushwaha",
			"jobTitle": "Senior Software Engineer",
			"worksFor": {
				"@type": "Organization",
				"name": "Target"
			},
			"url": "https://rajmanikush.com",
			"image": "https://rajmanikush.com/images/Rajmani-Kushwaha.jpeg",
			"sameAs": [
				"https://github.com/rajmanikush",
				"https://linkedin.com/in/rajmanikush"
			]
		}
		</script>

		<!-- Resource hints for Tailwind CDN -->
		<link rel="preconnect" href="https://cdn.tailwindcss.com">
		<link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>tailwind.config = { darkMode: 'class' }</script>
		<!-- Custom Styles -->
		<!-- Favicon -->
		<link rel="icon" href="/images/Rajmani-Kushwaha.jpeg" type="image/jpeg">
		<!-- Web App Manifest -->
		<link rel="manifest" href="/manifest.json">
		<link rel="stylesheet" type="text/css" href="/css/style.css">
	</head>
	<body class="bg-gray-50 dark:bg-gray-950 transition-colors duration-300">

		<!-- Navigation -->
		{% include nav.html %}

		<main>
			<!-- Hero Section -->
			{% include hero.html %}

			<!-- Overview Section -->
			{% include overview.html %}

			<!-- Experience Section -->
			{% include experience.html %}

			<!-- Skills Section -->
			{% include skills.html %}

			<!-- Portfolio Section -->
			{% include portfolio.html %}

			<!-- Resume Highlights Banner -->
			{% include resume.html %}
		</main>

		<!-- Footer -->
		{% include footer.html %}

		<!-- Custom JavaScript -->
		<script src="/js/main.js" defer></script>
	</body>
</html>
